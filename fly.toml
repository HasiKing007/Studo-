# Fly.io-Konfiguration. Der App-Name muss weltweit eindeutig sein.
app = "studo-plus-hasiking"
primary_region = "fra"

[env]
  STUDO_BASE_URL = "https://studo-plus-hasiking.fly.dev"
  STUDO_DB = "/data/studo.db"
  STUDO_SYNC_MINUTES = "30"
  STUDO_DEMO = "0"

# Persistenter Speicher für die SQLite-Datenbank (überlebt Deployments)
[[mounts]]
  source = "studo_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Immer an: Apple Kalender ruft den Feed jederzeit ab, und der Sync läuft im Hintergrund.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/manifest.json"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
